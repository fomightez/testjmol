<!DOCTYPE html>
<html>
<head>
    <title>Opening PNGjs in Jmol Applets Demo</title>
    <script type="text/javascript" src="JSmol.min.js"></script>
</head>
<body>
    <h1 style="text-align: center;">Opening PNGjs in Jmol Applets Demo</h1>
    
    <table border="0" align="center">
        <tr>
            <td align="center">
                <h2>Left Molecule</h2>
            </td>
            <td align="center">
                <h2>Right Molecule</h2>
            </td>
        </tr>
        <tr>
            <td align="center">
                <script type="text/javascript">
                    var Info1 = {
                        width: 400,
                        height: 400,
                        use: "HTML5",
                        j2sPath: "j2s",
                        serverURL: "php/jsmol.php",
                        script: 'load =8GFT; script hsp90/8gft_state_with_load_and_scale_echo_commented_off.spt; select [ATP];wireframe 0.3;spacefill 0.35; select [ADP];wireframe 0.3;spacefill 0.35; select :E; wireframe off; set ribbonborder on; set antialiasdisplay on; set hermitelevel 5; set highResolution ON;'
                    };
                    Jmol.getApplet("jmol1", Info1);
                </script>
            </td>
            <td align="center">
                <script type="text/javascript">
                    var Info2 = {
                        width: 400,
                        height: 400,
                        use: "HTML5",
                        j2sPath: "j2s",
                        serverURL: "php/jsmol.php",
                        script: 'load =8GFT; script hsp90/8gft_state_with_load_and_scale_echo_commented_off.spt; select [ATP];wireframe 0.3;spacefill 0.35; select [ADP];wireframe 0.3;spacefill 0.35; set ribbonborder on; set antialiasdisplay on; set hermitelevel 5; set highResolution ON;'
                    };
                    Jmol.getApplet("jmol2", Info2);
                </script>
            </td>
        </tr>
    </table>
</body>
</html>
