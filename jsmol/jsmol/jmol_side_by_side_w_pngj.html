<!DOCTYPE html>
<html>
<head>
    <title>Opening PNGjs in Jmol Applets Demo</title>
    <script type="text/javascript" src="JSmol.min.js"></script>
</head>
<body>
    <h1 style="text-align: center;">Opening PNGjs in Jmol Applets Demo</h1>
    
    <table border="0" align="center">
        <tr>
            <td align="center">
                <h2>Left Molecule</h2>
            </td>
            <td align="center">
                <h2>Right Molecule</h2>
            </td>
        </tr>
        <tr>
            <td align="center">
                <script type="text/javascript">
                    var Info1 = {
                        width: 400,
                        height: 400,
                        use: "HTML5",
                        j2sPath: "j2s",
                        serverURL: "php/jsmol.php",
                        script: 'load hsp90/PNGJ_for_JMOL_8GFT_from_pymol.png; delay 2; set echo ID delete;'
                    };
                    Jmol.getApplet("jmol1", Info1);
                </script>
            </td>
            <td align="center">
                <script type="text/javascript">
                    var Info2 = {
                        width: 400,
                        height: 400,
                        use: "HTML5",
                        j2sPath: "j2s",
                        serverURL: "php/jsmol.php",
                        script: 'load =8GFT; wireframe off; spacefill off; backbone off; color chain; cartoon on; set ribbonborder on; set antialiasdisplay on; set hermitelevel 5; set highResolution ON;'
                    };
                    Jmol.getApplet("jmol2", Info2);
                </script>
            </td>
        </tr>
    </table>
</body>
</html>
