<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSmol Simple Interface</title>
    <script type="text/javascript" src="JSmol.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        
        .main-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .viewer-panel {
            flex: 1 1 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .controls-panel {
            flex: 1 1 300px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .control-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .control-section:last-child {
            border-bottom: none;
        }
        
        .control-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        button, input[type="button"] {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        button:hover, input[type="button"]:hover {
            background-color: #2980b9;
        }
        
        select {
            padding: 6px;
            margin: 3px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        
        input[type="checkbox"] {
            margin-right: 5px;
        }
        
        label {
            display: inline-block;
            margin: 5px 0;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 5px 0;
        }
        
        .speed-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        
        .speed-controls a {
            background-color: #95a5a6;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .speed-controls a:hover {
            background-color: #7f8c8d;
        }
        
        #jmolApplet0_appletdiv {
            margin: 0 auto;
        }
        
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
        }
    </style>
    <script type="text/javascript">
        var jmolApplet0;
        var use = "HTML5";
        
        Jmol._debugCode = false;
        
        jmol_isReady = function(applet) {
            Jmol._getElement(applet, "appletdiv").style.border = "1px solid #ddd";
        }
        
        var Styles = [];
        Styles.push(["reset lighting; set cartoonsfancy off; set hermitelevel 0; set antialiasDisplay", "Jmol Fast Style"]);
        Styles.push(["reset lighting; set cartoonsfancy; set hermitelevel 20; set antialiasDisplay;", "Jmol Fancy Style"]);
        Styles.push(["set ambientpercent 25; set specularpower 100; set specularpercent 22; set specularexponent 4; set cartoonsfancy; set antialiasdisplay; set hermitelevel 20;", "Chimera Style"]);
        
        var script = 'set animframecallback "jmolscript:if (!selectionHalos) {select model=_modelNumber}";'
            + 'set antialiasdisplay;'
            + 'set errorCallback "myCallback";'
            + 'set defaultloadscript "isDssp = false; set defaultVDW babel; display *";'
            + 'set zoomlarge false; set echo top left; echo loading 1crn...; refresh;'
            + 'load "=1crn"; set echo top center; echo 1crn;'
            + 'spacefill off; wireframe off; cartoons on; color structure;';
        
        var Info = {
            width: 450,
            height: 450,
            debug: false,
            color: "white",
            addSelectionOptions: false,
            serverURL: "php/jsmol.php",
            use: "HTML5",
            j2sPath: "j2s",
            readyFunction: jmol_isReady,
            script: script,
            disableInitialConsole: true
        };
        
        Models = [];
        
        function addModel(xxxx, text) {
            var template = "xid='%1'; load =%1|%2 (%1)";
            Models.push(template.replace(/\%1/g, xxxx).replace(/%2/g, text).split("|"));
        }
        
        addModel("1crn", "small");
        addModel("1blu", "Fe/S");
        addModel("1bna", "b-DNA");
        addModel("1d66", "transcription");
        
        function jmolCheckbox(script1, script0, text, ischecked) {
            Jmol.jmolCheckbox(jmolApplet0, script1, script0, text, ischecked);
        }
        
        function jmolButton(script, text) {
            Jmol.jmolButton(jmolApplet0, script, text);
        }
        
        function jmolHtml(s) {
            document.write(s);
        }
        
        function jmolBr() {
            jmolHtml("<br>");
        }
        
        function jmolMenu(a) {
            Jmol.jmolMenu(jmolApplet0, a);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>JSmol Molecular Viewer</h1>
        
        <div class="main-layout">
            <div class="viewer-panel">
                <div class="speed-controls">
                    <span style="color: #666; margin-right: 10px;">Platform Speed:</span>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 8')">8</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 7')">7</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 6')">6</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 5')">5</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 4')">4</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 3')">3</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 2')">2</a>
                    <a href="javascript:Jmol.script(jmolApplet0, 'set platformSpeed 1')">1</a>
                </div>
                
                <div style="text-align: center;">
                    <script type="text/javascript">
                        jmolApplet0 = Jmol.getApplet("jmolApplet0", Info);
                    </script>
                </div>
                
                <div class="control-section" style="margin-top: 20px;">
                    <div class="button-group">
                        <script type="text/javascript">
                            Jmol.setButtonCss(null, "");
                            jmolButton("color cpk", "CPK");
                            jmolButton("color group", "Group");
                            jmolButton("color amino", "Amino");
                            jmolButton("color structure", "Structure");
                        </script>
                    </div>
                    <div class="button-group">
                        <script type="text/javascript">
                            jmolButton("backbone only", "Backbone");
                            jmolButton("trace only", "Trace");
                            jmolButton("cartoon only", "Cartoon");
                            jmolButton("spacefill only", "Spacefill");
                            jmolButton("spacefill only; spacefill 23%; wireframe 0.15", "Ball&Stick");
                        </script>
                    </div>
                    <div class="button-group">
                        <script type="text/javascript">
                            jmolButton("console", "Console");
                            Jmol.jmolCommandInput(jmolApplet0);
                        </script>
                    </div>
                </div>
            </div>
            
            <div class="controls-panel">
                <form>
                    <div class="control-section">
                        <h3>Load Structure</h3>
                        <script type="text/javascript">
                            Jmol.setButtonCss(null, "width: 100%;");
                            jmolButton("if (!xid) { xid = '1crn'}; var x = prompt('Enter a four-digit PDB ID', xid); if (!x) { quit }; xid = x; load @{'=' + x}", "Load PDB by ID");
                            jmolBr();
                            jmolCheckbox("set pdbAddHydrogens TRUE", "set pdbAddHydrogens FALSE", "with hydrogens", false);
                            jmolBr();
                            jmolCheckbox("set defaultLoadFilter 'biomolecule 1'", "set defaultLoadFilter ''", "biomolecule 1", false);
                        </script>
                    </div>
                    
                    <div class="control-section">
                        <h3>Examples</h3>
                        <script type="text/javascript">
                            Jmol.setMenuCss(null, "width: 100%;");
                            jmolMenu(Models);
                        </script>
                    </div>
                    
                    <div class="control-section">
                        <h3>Other Load Options</h3>
                        <script type="text/javascript">
                            Jmol.setButtonCss(null, "width: 100%;");
                            jmolButton("if (!molname) { molname = 'tylenol'}; var x = prompt('Enter the name or identifier (SMILES, InChI, CAS) of a molecule', molname); if (!x) { quit }; molname = x; load @{'$' + molname}", "Load MOL by NAME");
                            jmolBr();
                            jmolButton("load ?", "Load URL");
                            jmolBr();
                            jmolButton("load file://?", "Load FILE");
                            jmolBr();
                            jmolButton("script ?.spt", "Load SCRIPT");
                        </script>
                    </div>
                    
                    <div class="control-section">
                        <h3>Display Options</h3>
                        <script type="text/javascript">
                            jmolCheckbox("if (getproperty('shapeInfo.isosurface').length) {isosurface on} else {isosurface @{'=' + _modelName};}", "isosurface off", "show electron density", false);
                            jmolBr();
                            Jmol.setMenuCss(null, "width: 100%;");
                            jmolMenu(Styles);
                            jmolBr();
                            jmolCheckbox("set antialiasdisplay TRUE", "set antialiasdisplay FALSE", "antialiasDisplay", true);
                            jmolBr();
                            jmolCheckbox("display *", "display !water", "display water", true);
                            jmolBr();
                            jmolCheckbox("set zshade true", "set zshade false", "zshade (fog)", false);
                            jmolBr();
                            jmolCheckbox("background black", "background white", "background black", false);
                        </script>
                    </div>
                    
                    <div class="control-section">
                        <h3>Save Options</h3>
                        <script type="text/javascript">
                            Jmol.setButtonCss(null, "width: 100%;");
                            jmolButton("write FILE ?", "Save FILE");
                            jmolBr();
                            jmolButton("write IMAGE jsmol.jpg", "Save JPG");
                            jmolBr();
                            jmolButton("write IMAGE jsmol.png", "Save PNG");
                            jmolBr();
                            jmolButton("write jsmol.jmol", "Save Jmol");
                            jmolBr();
                            jmolButton("write PNGJ jsmol.png", "Save PNG+Jmol");
                            jmolBr();
                            jmolButton("write STATE jsmol.spt", "Save STATE");
                        </script>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
